<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2024 Recap</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- GSAP -->
    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="navbar-title">Happy New Year</div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">

        <!-- LEFT CONTENT -->
        <div class="hero-text">
            <h1><span>Step Into Something New</span></h1>
            <h1>Every ending brings a beginning.<br>
                This year, choose courage, joy, and progress.</h1><br>
            <h1>Embrace the New Year with Openness and Faith.</h1>

        </div>

        <!-- RIGHT VIDEO -->
        <div class="video-wrapper">
            <div class="video-frame">
                <video autoplay loop playsinline>
                    <source src="recap.mov" type="video/mp4">
                </video>
                <button id="muteToggle" class="mute-toggle">🔊</button>

                <div class="video-overlay">
                    <h3>✨ Happy New Year 2026</h3>
                    <p>Your Moments • Your Wins</p>
                </div>
            </div>
        </div>

    </section>

    <script src="script.js"></script>
</body>

</html>
